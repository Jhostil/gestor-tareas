version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: oracle-xe
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=TASKS_USER
      - APP_USER_PASSWORD=password
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init.sql:/container-entrypoint-initdb.d/init.sql

volumes:
  oracle-data: